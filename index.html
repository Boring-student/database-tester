<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>My Discord Stats</title></head>
<body>
  <button id="login">Login with Discord</button>
  <div id="stats"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      'https://pfvacscajzkltpvuhiyg.supabase.co',
      'sb_publishable_bcz9sKLDhnY7ibUMXcxlDA_EbkADbp3'
    );

    sb.auth.onAuthStateChange((event, session) => {
      if (session?.provider_token) {
        const isDiscord = session.user?.identities?.some(
          (i) => i.provider === 'discord' || i.provider === 'custom:discord',
        );
        if (isDiscord) {
          sessionStorage.setItem('discord_provider_token', session.provider_token);
        }
      }
    });

    document.getElementById('login').addEventListener('click', async () => {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'discord',
        options: {
          redirectTo: window.location.origin + window.location.pathname,
          scopes: 'identify guilds guilds.members.read',
        },
      });
      if (error) console.error('Login error:', error);
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
    }

    /** Returns inline CSS for a role's color/gradient text. */
    function roleTextStyle(color, gradient) {
      if (gradient) {
        return `background:${escapeHtml(gradient)};-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-weight:600;`;
      }
      if (color) {
        return `color:${escapeHtml(color)};font-weight:600;`;
      }
      return 'font-weight:600;';
    }

    /** Returns inline CSS for the colored dot next to the role name. */
    function roleDotStyle(color, gradient) {
      if (gradient) return `background:${escapeHtml(gradient)};`;
      if (color) return `background:${escapeHtml(color)};`;
      return 'background:#888;';
    }

    function renderMembership(data) {
      const tier = data.tier || 'none';
      const name = data.role_name;
      const color = data.role_color;
      const gradient = data.role_gradient;

      if (tier === 'none' || !name) {
        return 'Membership: none';
      }

      const dot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;${roleDotStyle(color, gradient)}"></span>`;
      const text = `<span style="${roleTextStyle(color, gradient)}">${escapeHtml(name)}</span>`;

      return `Membership: ${dot}${text}`;
    }

    function renderBooster(data) {
      if (!data.is_booster) return '';

      const name = data.booster_name || 'Nitro Booster';
      const color = data.booster_color;
      const gradient = data.booster_gradient;

      // Reuse the same style helpers as the tier role
      const dot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;${roleDotStyle(color || '#FF73FA', gradient)}"></span>`;
      const text = `<span style="${roleTextStyle(color || '#FF73FA', gradient)}">⚡ ${escapeHtml(name)}</span>`;

      const since = data.boosting_since
        ? ` <small>— boosting since ${new Date(data.boosting_since).toLocaleDateString()}</small>`
        : '';

      return `<br>Booster: ${dot}${text}${since}`;
    }

    function renderRobloxLine(data) {
      const display = data.roblox_display_name;
      const username = data.roblox_username;
      const raw = data.roblox_nick_raw;

      if (display && username) {
        return `Roblox: <strong>${escapeHtml(display)}</strong> (@${escapeHtml(username)})`;
      }
      if (raw) {
        return `Roblox: ${escapeHtml(raw)} <small>(nick not in RoVer format)</small>`;
      }
      return 'Roblox: not linked';
    }

    async function load() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;

      const providerToken =
        session.provider_token || sessionStorage.getItem('discord_provider_token');

      const statsEl = document.getElementById('stats');
      statsEl.textContent = 'Loading…';

      const { data, error } = await sb.functions.invoke('member-info', {
        body: { provider_token: providerToken },
      });

      if (error) {
        let body = data;
        try {
          if (!body && error.context?.body) {
            body = await new Response(error.context.body).json();
          }
        } catch { /* ignore */ }

        if (body?.error === 'discord_login_required') {
          statsEl.textContent = 'Please log in with Discord to view your stats.';
        } else if (body?.error === 'not_linked') {
          statsEl.textContent = 'Your Discord account could not be resolved.';
        } else if (body?.error === 'Not logged in') {
          statsEl.textContent = 'Please log in.';
        } else {
          statsEl.textContent = 'Something went wrong.';
          console.error(error, body);
        }
        return;
      }

      if (!data) {
        statsEl.textContent = 'Something went wrong.';
        return;
      }

      const notice = providerToken
        ? ''
        : '<br><small>Session expired — <a href="#" id="relogin">log in with Discord again</a> to refresh this data.</small>';

      statsEl.innerHTML = `
        Messages: ${data.stats?.message_count ?? 'n/a'}<br>
        Joined server: ${data.joined_at ? new Date(data.joined_at).toLocaleDateString() : 'unknown'}<br>
        ${renderMembership(data)}${renderBooster(data)}<br>
        ${renderRobloxLine(data)}
        ${notice}
      `;

      const relogin = document.getElementById('relogin');
      if (relogin) {
        relogin.addEventListener('click', (e) => {
          e.preventDefault();
          sessionStorage.removeItem('discord_provider_token');
          document.getElementById('login').click();
        });
      }
    }
    load();
  </script>
</body>
</html>
