<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<button id="login">Login with Discord</button>
<div id="stats"></div>

<script>
const supabase = window.supabase.createClient(
  'https://pfvacscajzkltpvuhiyg.supabase.co',
  'YOUR-ANON-KEY'            // the public anon key is fine here
);

document.getElementById('login').onclick = () =>
  supabase.auth.signInWithOAuth({
    provider: 'discord',
    options: { redirectTo: window.location.href }
  });

async function load() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return;

  const { data, error } = await supabase.functions.invoke('member-info');
  if (error || !data) {
    document.getElementById('stats').textContent = 'Something went wrong.';
    return;
  }

  document.getElementById('stats').innerHTML = `
    Messages: ${data.stats?.message_count ?? 'n/a'}<br>
    Joined server: ${data.joined_at ? new Date(data.joined_at).toLocaleDateString() : 'unknown'}<br>
    Roblox: ${data.roblox_username ?? 'not linked'}
  `;
}
load();
</script>
