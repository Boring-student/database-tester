<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>My Discord Stats</title></head>
<body>
  <button id="login">Login with Discord</button>
  <button id="login-roblox">Login with Roblox</button>
  <div id="stats"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      'https://pfvacscajzkltpvuhiyg.supabase.co',
      'sb_publishable_bcz9sKLDhnY7ibUMXcxlDA_EbkADbp3'
    );

    document.getElementById('login').addEventListener('click', async () => {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'custom:discord',
        options: { redirectTo: window.location.origin + window.location.pathname },
      });
      if (error) console.error('Login error:', error);
    });
    document.getElementById('login-roblox').addEventListener('click', () =>
      sb.auth.signInWithOAuth({
        provider: 'custom:roblox',
        options: { redirectTo: window.location.origin + window.location.pathname },
      })
    );

    async function load() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;

      const { data, error } = await sb.functions.invoke('member-info');
      if (error || !data) {
        document.getElementById('stats').textContent = 'Something went wrong.';
        console.error(error);
        return;
      }

      document.getElementById('stats').innerHTML = `
        Messages: ${data.stats?.message_count ?? 'n/a'}<br>
        Joined server: ${data.joined_at ? new Date(data.joined_at).toLocaleDateString() : 'unknown'}<br>
        Roblox: ${data.roblox_username ?? 'not linked'}
      `;
    }
    load();
  </script>
</body>
</html>
